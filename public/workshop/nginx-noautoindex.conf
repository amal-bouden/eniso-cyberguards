server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Defense in depth: directory listing is off by default in nginx, but we
    # say so explicitly - a browsable file listing would be just as bad as a
    # guessable URL for leaking anything accidentally dropped into a public/
    # folder later.
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }
}
